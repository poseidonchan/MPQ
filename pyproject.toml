[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpq"
version = "0.1.0"
description = "MPQ unified solver for GPTQModel and QUIP#"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["mpq*"]
