[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpq"
version = "0.1.0"
description = "Message-passing post-training quantization for large language models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy",
]
keywords = ["llm", "quantization", "gptq", "vamp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/poseidonchan/MPQ"
Documentation = "https://github.com/poseidonchan/MPQ#readme"

[project.scripts]
mpq = "mpq.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["mpq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
